name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint • typecheck • build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # /api/health builds without a live DB; the route only runs at request time.
          # If we ever add a build-time DB step, point this at a CI MySQL service.
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
        run: npm run build

      - name: Test
        run: npm test
