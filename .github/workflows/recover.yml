name: Recover

# Agent-callable Hostinger recovery via SSH.
# Trigger from any laptop with `gh workflow run recover.yml -f action=<action>`.
# Read output with `gh run view <run-id> --log`.
# Design doc: docs/deploy/agent-recovery.md

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do on the Hostinger box"
        required: true
        type: choice
        options:
          - tail-logs
          - verify-deploy
          - pull-and-restart
          - rollback
          - db-bootstrap
          - db-schema-push
          - db-audit-places
          - db-cleanup-seed-places
          - db-migrate-verification
          - provision-admin-env
          - diagnose
          - reap-workers
      lines:
        description: "tail-logs: number of log lines to print (default 200)"
        required: false
        default: "200"
        type: string
      target_sha:
        description: "rollback: commit SHA to check out before restart"
        required: false
        type: string
      pids:
        description: "reap-workers: space-separated PIDs to SIGTERM (default: all stale lsnode workers, keeping youngest)"
        required: false
        type: string

concurrency:
  group: recover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    # 25 min — pull-and-restart/rollback do npm ci + next build on the
    # Hostinger box, which routinely takes 3-6 min there + rsync overhead.
    # The previous 10-min cap killed runs mid-rsync and corrupted APP_PATH.
    timeout-minutes: 25
    steps:
      - name: Verify required secrets
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          set -eu
          missing=()
          [ -z "${HOST:-}" ] && missing+=("HOSTINGER_SSH_HOST")
          [ -z "${USER:-}" ] && missing+=("HOSTINGER_SSH_USER")
          [ -z "${KEY:-}" ] && missing+=("HOSTINGER_SSH_KEY")
          [ -z "${APP_PATH:-}" ] && missing+=("HOSTINGER_APP_PATH")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}"
            echo "Board action required: see docs/deploy/agent-recovery.md §3."
            exit 1
          fi

      - name: Load SSH key
        id: load_ssh
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT_OVERRIDE: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Strip CRs in case the secret was pasted with Windows line endings.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_recover
          chmod 600 ~/.ssh/id_recover
          # Diagnostic: verify private key parses (does not reveal key material).
          if ! ssh-keygen -y -f ~/.ssh/id_recover > /dev/null 2>&1; then
            echo "::error::HOSTINGER_SSH_KEY does not parse as a valid OpenSSH private key."
            echo "Common causes: wrong key pasted (public not private), missing BEGIN/END lines,"
            echo "extra whitespace, or wrong format (PEM vs OpenSSH). Regenerate with"
            echo "ssh-keygen -t ed25519 -f ~/.ssh/noc-recovery and paste the full contents of"
            echo "~/.ssh/noc-recovery (not the .pub file) into HOSTINGER_SSH_KEY."
            exit 1
          fi
          # Diagnostic: ensure HOST is a bare hostname, not user@host or host:port.
          case "$HOST" in
            *@*) echo "::error::HOSTINGER_SSH_HOST contains '@' — it should be just the hostname (paste user part into HOSTINGER_SSH_USER)." ; exit 1 ;;
            *:*) echo "::error::HOSTINGER_SSH_HOST contains ':' — strip any port suffix and set HOSTINGER_SSH_PORT instead." ; exit 1 ;;
            */*) echo "::error::HOSTINGER_SSH_HOST contains '/' — paste just the hostname, not a URL." ; exit 1 ;;
          esac
          # Detect the SSH port. Try, in order:
          #   1. HOSTINGER_SSH_PORT secret if set (explicit override).
          #   2. 65002 — Hostinger Business/Premium shared hosting standard.
          #   3. 22 — generic default (Hostinger VPS, custom setups).
          detected_port=""
          for port in ${PORT_OVERRIDE:-} 65002 22; do
            [ -z "$port" ] && continue
            if ssh-keyscan -T 5 -p "$port" -H "$HOST" >> ~/.ssh/known_hosts 2> /tmp/keyscan.err; then
              detected_port="$port"
              break
            fi
          done
          if [ -z "$detected_port" ]; then
            echo "::error::ssh-keyscan failed on every candidate port (override=${PORT_OVERRIDE:-none}, 65002, 22)."
            echo "stderr from the last attempt (host value is masked by Actions):"
            cat /tmp/keyscan.err
            echo "Likely causes:"
            echo "  - SSH not enabled in hPanel → Advanced → SSH Access yet."
            echo "  - HOSTINGER_SSH_HOST is wrong (use the host shown in hPanel, no user@)."
            echo "  - Non-standard port: set HOSTINGER_SSH_PORT to the value shown in hPanel."
            exit 1
          fi
          echo "Using SSH port: $detected_port"
          echo "port=$detected_port" >> "$GITHUB_OUTPUT"

      - name: tail-logs
        if: inputs.action == 'tail-logs'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          LINES: ${{ inputs.lines }}
        run: |
          set -eu
          LINES_INT="${LINES:-200}"
          # Hostinger writes the Node runtime logs as siblings of server.js in
          # the application root (console.log, stderr.log), not under a nested
          # nodejs/ directory. Tail both, plus the legacy stdout.log path in
          # case the layout differs on other plans.
          #
          # Use a single inline exec command (no heredoc + `env VAR=...` prefix):
          # Hostinger's shared-hosting sshd rejects multi-env-var exec requests
          # with "exec request failed on channel 0". Single-string exec works.
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            "cd \"$APP_PATH\" && for f in stderr.log console.log stdout.log nodejs/stderr.log nodejs/stdout.log; do [ -f \"\$f\" ] || continue; echo \"=== \$f (last $LINES_INT lines) ===\"; tail -n $LINES_INT \"\$f\" || true; echo; done"

      - name: diagnose
        if: inputs.action == 'diagnose'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        run: |
          set -eu
          # Single-command inline exec — Hostinger's sshd rejects heredoc+env requests
          # (see the tail-logs comment above). We bake APP_PATH into the literal string.
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" "
            set +e
            cd \"$APP_PATH\"
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:\$PATH
            echo '=== node --version ==='
            node --version || true
            echo
            echo '=== curl localhost loopback probes ==='
            for p in 3000 8080 \${PORT:-} ; do
              [ -n \"\$p\" ] || continue
              code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \"http://127.0.0.1:\$p/api/health/version\" 2>/dev/null || echo TIMEOUT)
              echo \"port \$p -> \$code\"
            done
            echo
            echo '=== running node processes ==='
            ps -fu \$(id -u) | grep -E '[n]ode|server\\.js' || echo 'no node procs'
            echo
            echo '=== env of running node process (if any) ==='
            for pid in \$(pgrep -u \$(id -u) -f 'server.js' 2>/dev/null); do
              echo --- pid \$pid ---
              ( tr '\\0' '\\n' < /proc/\$pid/environ 2>/dev/null \
                  | grep -Ev '^(.*PASS|.*KEY|.*TOKEN|.*SECRET|DATABASE_URL|.*SSH)' \
                  | sort ) || echo 'cannot read environ'
              echo --- cwd ---
              readlink /proc/\$pid/cwd 2>/dev/null || true
              echo --- cmdline ---
              tr '\\0' ' ' < /proc/\$pid/cmdline 2>/dev/null; echo
            done
            echo
            echo '=== sockets owned by user (ss -tlnp / unix) ==='
            ss -tlnp 2>/dev/null | head -40 || netstat -tlnp 2>/dev/null | head -40 || echo 'no ss/netstat'
            echo
            ss -xlp 2>/dev/null | head -20 || true
            echo
            echo '=== tmp/ contents ==='
            ls -la tmp/ 2>/dev/null || true
            echo
            echo '=== nodejs/.env (existence, NO contents) ==='
            for f in nodejs/.env .env .env.production \$HOME/.env; do
              [ -e \"\$f\" ] && echo \"present: \$f (\$(wc -c < \"\$f\") bytes)\"
            done
            echo
            echo '=== console.log tail (last 60 lines, after diagnose started) ==='
            tail -n 60 console.log 2>/dev/null || true
            echo
            echo '=== which node + path ==='
            command -v node || find /opt /usr /home/\$(whoami) -maxdepth 6 -name node -type f 2>/dev/null | head -5
            echo
            echo '=== server.js head ==='
            head -20 server.js
            echo
            echo '=== timeout 10 node server.js (manual launch, captures stdout+stderr) ==='
            ( timeout --foreground 10 node server.js 2>&1 ) | head -120 || echo manual node exit: \$?
          "

      # NOC-89: reap stuck LiteSpeed/Passenger lsnode workers when Hostinger
      # spawns a new node for every webhook-driven restart and the old workers
      # never get reaped, pinning the CloudLinux PID/thread cgroup. Without
      # this we'd have to ask the board to click hPanel → Node.js → Restart.
      #
      # If `pids` input is empty, the SSH-side script auto-discovers all
      # lsnode.js workers under the current user and reaps everything except
      # the youngest (so Passenger keeps a request-serving worker). With an
      # explicit `pids` value, only those are signalled — useful when a future
      # incident needs a specific subset killed.
      - name: reap-workers
        if: inputs.action == 'reap-workers'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          PIDS: ${{ inputs.pids }}
        run: |
          set -eu
          # Single-string exec (Hostinger sshd rejects heredoc+env requests —
          # same reason tail-logs/diagnose use this pattern).
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" "
            set +e
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:\$PATH
            echo '=== pre-reap ps ==='
            ps -fu \$(id -u) | grep -E '[l]snode\.js' || echo 'no lsnode procs'
            echo
            # Resolve target PIDs.
            input_pids='$PIDS'
            if [ -z \"\$input_pids\" ]; then
              # Auto-discover: every lsnode.js worker under our uid, sorted by
              # start time (oldest first), drop the youngest so Passenger
              # always has one worker available to take new requests.
              all=\$(ps -u \$(id -u) -o pid=,lstart=,cmd= | grep '[l]snode\\.js' | awk '{print \$1\"|\"\$2\" \"\$3\" \"\$4\" \"\$5\" \"\$6}' | sort -t'|' -k2)
              echo '--- candidates (oldest -> newest) ---'
              echo \"\$all\"
              count=\$(echo \"\$all\" | grep -c . || true)
              if [ \"\$count\" -le 1 ]; then
                echo 'only one (or zero) lsnode worker — nothing to reap'
                exit 0
              fi
              # Take all but the last (youngest).
              kill_pids=\$(echo \"\$all\" | head -n -1 | awk -F'|' '{print \$1}' | tr '\\n' ' ')
            else
              kill_pids=\"\$input_pids\"
            fi
            echo
            echo \"=== reaping: \$kill_pids ===\"
            for pid in \$kill_pids; do
              # Use bash builtin kill (no fork) — works even under PID pressure.
              # If the PID is already dead, kill returns 1; we log and continue.
              if kill \"\$pid\" 2>/dev/null; then
                echo \"SIGTERM \$pid: ok\"
              else
                echo \"SIGTERM \$pid: not running or no permission\"
              fi
            done
            echo
            echo '=== sleeping 10s for graceful exit ==='
            sleep 10
            echo
            echo '=== sigkill survivors ==='
            survivors=''
            for pid in \$kill_pids; do
              if kill -0 \"\$pid\" 2>/dev/null; then
                echo \"\$pid still alive — SIGKILL\"
                kill -9 \"\$pid\" 2>/dev/null || echo \"  SIGKILL \$pid failed\"
                survivors=\"\$survivors \$pid\"
              fi
            done
            [ -z \"\$survivors\" ] && echo 'all reaped on SIGTERM'
            sleep 3
            echo
            echo '=== post-reap ps ==='
            ps -fu \$(id -u) | grep -E '[l]snode\\.js' || echo 'no lsnode procs remaining'
            echo
            echo '=== nudge passenger to spawn a fresh worker ==='
            cd \"$APP_PATH\"
            mkdir -p tmp
            touch tmp/restart.txt
            echo 'restart.txt touched'
            echo
            echo '=== loopback probe (give passenger 8s to spawn) ==='
            sleep 8
            for p in 3000 8080; do
              code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \"http://127.0.0.1:\$p/api/health/version\" 2>/dev/null || echo TIMEOUT)
              echo \"port \$p -> \$code\"
            done
          "

      - name: verify-deploy
        if: inputs.action == 'verify-deploy'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          PROD_BASE_URL: "https://www.nocuju.cz"
        run: |
          set -eu
          # Primary source of truth on Hostinger's managed Node hosting:
          # /api/health/version. The build inlines NEXT_PUBLIC_COMMIT_SHA so
          # the running app reports its own SHA — works even when the box has
          # no .git checkout (Hostinger ships build artifacts, not the repo).
          echo "--- HTTP /api/health/version ---"
          if ! curl -fsS --max-time 10 "$PROD_BASE_URL/api/health/version"; then
            echo
            echo "::warning::HTTP /api/health/version failed — the app may be down."
          fi
          echo
          echo "--- SSH box state ---"
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            env APP_PATH="$APP_PATH" bash -se <<'EOF'
            set -eu
            # Auto-discover the deployed git checkout. Hostinger's "Pull from
            # GitHub" feature drops .git at different paths depending on plan,
            # so we check APP_PATH first, then walk up, then sniff $HOME.
            sha=""
            found_at=""
            for candidate in "$APP_PATH" "$(dirname "$APP_PATH")" "$(dirname "$(dirname "$APP_PATH")")" "$HOME"; do
              [ -d "$candidate/.git" ] || continue
              s=$(git -C "$candidate" rev-parse HEAD 2>/dev/null || true)
              if [ -n "$s" ]; then sha="$s"; found_at="$candidate"; break; fi
            done

            if [ -z "$sha" ]; then
              # No .git in APP_PATH (normal on Hostinger Business — see NOC-65).
              # Fall back to the deploy marker recover.yml writes on each
              # pull-and-restart/rollback, and to the source checkout we
              # maintain at $HOME/.noc-src.
              echo "deploy_mode=no_git_checkout"
              if [ -f "$APP_PATH/.noc-deploy-sha" ]; then
                echo "last_recover_deploy_sha=$(cat "$APP_PATH/.noc-deploy-sha")"
              else
                echo "last_recover_deploy_sha=none (recover.yml hasn't deployed yet)"
              fi
              if [ -d "$HOME/.noc-src/.git" ]; then
                echo "src_checkout_sha=$(git -C "$HOME/.noc-src" rev-parse HEAD 2>/dev/null || echo unknown)"
              else
                echo "src_checkout=absent ($HOME/.noc-src not initialized)"
              fi
              echo "--- ls -la \$APP_PATH ---"
              ls -la "$APP_PATH" 2>/dev/null | head -40 || echo "(APP_PATH not readable)"
              echo "--- candidate .git locations under HOME ---"
              find "$HOME" -maxdepth 4 -name .git -type d 2>/dev/null | head -10 || true
              exit 0
            fi

            echo "deploy_mode=git_checkout"
            echo "deployed_sha=$sha"
            echo "deployed_path=$found_at"
            branch=$(git -C "$found_at" rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)
            echo "deployed_branch=$branch"
            echo "last_commit:"
            git -C "$found_at" log -1 --format='%H %ci %s' || true
          EOF

      # pull-and-restart and rollback share one body. They differ only in the
      # git ref to deploy: main vs. an explicit SHA. See NOC-65 for the design
      # (build on the CI runner, rsync the standalone tree into APP_PATH).
      #
      # Why the build runs on the CI runner instead of on Hostinger:
      # Hostinger Business' CloudLinux user cgroup nproc/threads cap is low
      # enough in a regular SSH shell that `next build` (Turbopack OR webpack)
      # fails at worker spawn with `ERR_WORKER_INIT_FAILED` / `EAGAIN`. hPanel's
      # built-in deploy worker runs with a relaxed cgroup so its own pulls
      # build fine, but we have no access to that channel via SSH. The CI
      # runner has the resources Next needs and produces a portable Linux/x64
      # standalone tree we can simply rsync into APP_PATH.
      - name: deploy-ref - resolve target
        if: inputs.action == 'pull-and-restart' || inputs.action == 'rollback'
        id: deploy_target
        env:
          ACTION: ${{ inputs.action }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -eu
          if [ "$ACTION" = "rollback" ] && [ -z "${TARGET_SHA:-}" ]; then
            echo "::error::rollback requires -f target_sha=<sha>"
            exit 1
          fi
          if [ "$ACTION" = "pull-and-restart" ]; then
            REF=main
          else
            REF="$TARGET_SHA"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "target ref: $REF"

      - name: deploy-ref - checkout
        if: inputs.action == 'pull-and-restart' || inputs.action == 'rollback'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deploy_target.outputs.ref }}
          fetch-depth: 1

      - name: deploy-ref - setup node
        if: inputs.action == 'pull-and-restart' || inputs.action == 'rollback'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: deploy-ref - build standalone
        if: inputs.action == 'pull-and-restart' || inputs.action == 'rollback'
        env:
          # Bake the committed SHA so /api/health/version reports what we
          # actually deployed (NOC-54). actions/checkout leaves HEAD at the
          # resolved ref, so git rev-parse HEAD is the right value.
          NODE_ENV: production
        run: |
          set -eu
          BUILD_COMMIT_SHA=$(git rev-parse HEAD)
          export BUILD_COMMIT_SHA
          echo "src_sha=$BUILD_COMMIT_SHA"
          npm ci --prefer-offline --no-audit --no-fund
          # npm run build runs the postbuild patch (NOC-64).
          npm run build
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::expected .next/standalone/server.js after build"
            ls -la .next/ || true
            exit 1
          fi
          echo "src_sha=$BUILD_COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: deploy-ref - rsync to APP_PATH + restart
        if: inputs.action == 'pull-and-restart' || inputs.action == 'rollback'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          ACTION: ${{ inputs.action }}
        run: |
          set -eu
          SRC_SHA=$(git rev-parse HEAD)

          SSH_BASE="ssh -i $HOME/.ssh/id_recover -p $PORT -o BatchMode=yes"

          # Hostinger's shared sshd drops `bash -s` heredoc-driven sessions
          # within ~1s of auth (likely a fail2ban-ish or PAM-quirk applied to
          # non-interactive stdin pipes). Inline single-string exec — the same
          # pattern tail-logs/diagnose use successfully — is reliable. We
          # bake $APP_PATH and $ACTION in from the outer shell and escape $vars
          # that should expand on the remote.
          # Cheap point-in-time snapshot of APP_PATH (hardlinked) so a broken
          # deploy can be inspected or manually reverted. Keep last 5.
          $SSH_BASE "$USER@$HOST" "set -eu; \
            ts=\$(date -u +%Y%m%dT%H%M%SZ); \
            mkdir -p \"\$HOME/.noc-snapshots\"; \
            SNAP=\"\$HOME/.noc-snapshots/pre-${ACTION}-\${ts}\"; \
            cp -al \"$APP_PATH\" \"\$SNAP\"; \
            echo \"pre_state_snapshot=\$SNAP\"; \
            ls -1dt \"\$HOME\"/.noc-snapshots/pre-* 2>/dev/null | tail -n +6 | xargs -r rm -rf"

          # 1) Sync standalone tree to APP_PATH (server.js, package.json,
          #    node_modules/, .next/server/, required-server-files.json).
          #    --delete removes stale files from prior builds; excludes preserve
          #    runtime artifacts (logs, tmp, env) and .next/static + public
          #    which we sync separately below.
          rsync -a --delete -e "$SSH_BASE" \
            --exclude='/.next/static/' \
            --exclude='/public/' \
            --exclude='/tmp/' \
            --exclude='/console.log' \
            --exclude='/stderr.log' \
            --exclude='/*.log' \
            --exclude='/nodejs/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.noc-deploy-sha' \
            .next/standalone/ "$USER@$HOST:$APP_PATH/"

          # 2) Static asset bundles (the browser fetches these from /_next/).
          rsync -a --delete -e "$SSH_BASE" \
            .next/static/ "$USER@$HOST:$APP_PATH/.next/static/"

          # 3) public/ (favicon, images, robots.txt, etc.).
          rsync -a --delete -e "$SSH_BASE" \
            public/ "$USER@$HOST:$APP_PATH/public/"

          # 4) Marker + env restore + restart signal. The marker lets
          #    verify-deploy report what we last deployed (APP_PATH has no
          #    .git to inspect). APP_PATH/.env is re-installed from the
          #    $HOME/.noc-env master copy on every deploy: NOC-102 showed
          #    .env can vanish from APP_PATH across deploys even though our
          #    rsync excludes protect it, so the durable copy lives outside
          #    APP_PATH and is restored before the restart.
          $SSH_BASE "$USER@$HOST" "set -eu; \
            printf '%s\n' '$SRC_SHA' > \"$APP_PATH/.noc-deploy-sha\"; \
            if [ -f \"\$HOME/.noc-env\" ]; then \
              cp \"\$HOME/.noc-env\" \"$APP_PATH/.env\"; \
              chmod 600 \"$APP_PATH/.env\"; \
              echo env_restored_from_home_master; \
            fi; \
            mkdir -p \"$APP_PATH/tmp\"; \
            touch \"$APP_PATH/tmp/restart.txt\"; \
            echo \"deployed_sha=$SRC_SHA\"; \
            echo restart_signalled"

      - name: db-schema-push
        if: inputs.action == 'db-schema-push'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            env APP_PATH="$APP_PATH" bash -se <<'EOF'
            set -eu
            cd "$APP_PATH"
            # drizzle-kit reads DATABASE_URL from process.env (see drizzle.config.ts).
            # Hostinger's Node.js app sets it as a system env var, so a login
            # shell here inherits it. If it's not exported in the SSH session,
            # surface that clearly instead of silently writing to nothing.
            # Hostinger sets DATABASE_URL on the Node.js process, not in interactive
            # SSH. Try common locations a Hostinger Business plan writes env to.
            for candidate in nodejs/.env .env .env.production "$HOME/.env"; do
              if [ -f "$candidate" ] && grep -q '^DATABASE_URL=' "$candidate"; then
                set -a
                . "$candidate"
                set +a
                break
              fi
            done
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "::error::DATABASE_URL not found in SSH session or .env files"
              echo "Looked in: nodejs/.env, .env, .env.production, ~/.env."
              echo "Fix: paste the prod DSN into a GitHub secret HOSTINGER_DATABASE_URL"
              echo "and rerun this workflow. See docs/deploy/agent-recovery.md §db."
              exit 1
            fi
            echo 'database_host='$(echo "$DATABASE_URL" | sed -E 's|.*@([^/:]+).*|\1|')
            # drizzle-kit lives in devDependencies; prod tree is installed with
            # NODE_ENV=production, so devDeps aren't present. Install on demand.
            npx --yes drizzle-kit push --config=drizzle.config.ts
            echo 'schema_push_complete'
          EOF

      - name: db-bootstrap
        if: inputs.action == 'db-bootstrap'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            env APP_PATH="$APP_PATH" bash -se <<'EOF'
            set -eu
            cd "$APP_PATH"
            for candidate in nodejs/.env .env .env.production "$HOME/.env"; do
              if [ -f "$candidate" ] && grep -q '^DATABASE_URL=' "$candidate"; then
                set -a
                . "$candidate"
                set +a
                break
              fi
            done
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "::error::DATABASE_URL not found in SSH session or .env files"
              echo "Looked in: nodejs/.env, .env, .env.production, ~/.env."
              echo "Fix: paste the prod DSN into a GitHub secret HOSTINGER_DATABASE_URL"
              echo "and rerun this workflow. See docs/deploy/agent-recovery.md §db."
              exit 1
            fi
            echo 'database_host='$(echo "$DATABASE_URL" | sed -E 's|.*@([^/:]+).*|\1|')
            echo '--- step 1: drizzle-kit push'
            npx --yes drizzle-kit push --config=drizzle.config.ts
            echo '--- step 2: seed (idempotent: re-running is safe)'
            npx --yes tsx scripts/seed.ts
            echo 'bootstrap_complete'
          EOF

      # The audit/cleanup endpoints live in the running Next.js app
      # (/api/setup/audit-places, /api/setup/cleanup-seed-places). We invoke
      # them through the public domain so no script needs to be present on the
      # Hostinger box. SETUP_TOKEN is read from the live Node process's
      # /proc/<pid>/environ over a short SSH session (CloudLinux allows same-UID
      # reads). This avoids npx/tsx downloads that previously timed out under
      # CloudLinux resource caps.
      - name: db-audit-places
        if: inputs.action == 'db-audit-places'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          PUBLIC_URL: ${{ secrets.HOSTINGER_PUBLIC_URL || 'https://www.nocuju.cz' }}
        run: |
          set -eu
          token=$(ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            'pid=$(pgrep -u "$(id -u)" -f '\''lsnode\.js|node.*server\.js'\'' | head -1); [ -n "$pid" ] && tr "\0" "\n" < "/proc/$pid/environ" | grep -E "^SETUP_TOKEN=" | sed "s/^SETUP_TOKEN=//"' || true)
          if [ -z "$token" ]; then
            echo "::error::SETUP_TOKEN not found in live Node process /proc environ."
            exit 1
          fi
          echo '--- prod places audit ---'
          curl -fsS -X POST -H "Authorization: Bearer $token" \
            "$PUBLIC_URL/api/setup/audit-places" | jq .
          echo 'audit_complete'

      - name: db-cleanup-seed-places
        if: inputs.action == 'db-cleanup-seed-places'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          PUBLIC_URL: ${{ secrets.HOSTINGER_PUBLIC_URL || 'https://www.nocuju.cz' }}
        run: |
          set -eu
          token=$(ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            'pid=$(pgrep -u "$(id -u)" -f '\''lsnode\.js|node.*server\.js'\'' | head -1); [ -n "$pid" ] && tr "\0" "\n" < "/proc/$pid/environ" | grep -E "^SETUP_TOKEN=" | sed "s/^SETUP_TOKEN=//"' || true)
          if [ -z "$token" ]; then
            echo "::error::SETUP_TOKEN not found in live Node process /proc environ."
            exit 1
          fi
          echo '--- prod places cleanup (seed:// only) ---'
          curl -fsS -X POST -H "Authorization: Bearer $token" \
            "$PUBLIC_URL/api/setup/cleanup-seed-places?confirm=yes" | jq .
          echo 'cleanup_complete'

      - name: db-migrate-verification
        if: inputs.action == 'db-migrate-verification'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PUBLIC_URL: ${{ secrets.HOSTINGER_PUBLIC_URL || 'https://www.nocuju.cz' }}
        run: |
          set -eu
          # The prod app gets its env only from what lsnode injects at spawn
          # (no .env existed on the box as of NOC-101), so there is no
          # SETUP_TOKEN to discover. The standalone Next server loads
          # APP_PATH/.env at startup (base-server loadEnvConfig), so we
          # generate a token into that file once, restart via tmp/restart.txt
          # and call the endpoint from the box. The token never leaves the
          # box and is never printed. Idempotent: an existing token in .env
          # or a live process environ is reused, and the endpoint itself
          # guards every DDL statement with information_schema checks.
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            "APP_PATH='$APP_PATH' PUBLIC_URL='$PUBLIC_URL' bash -se" <<'EOF'
          set -eu
          cd "$APP_PATH"
          token=""
          if [ -f .env ]; then
            token=$(grep -E '^SETUP_TOKEN=' .env | head -1 | cut -d= -f2-) || true
          fi
          if [ -z "$token" ]; then
            for e in /proc/[0-9]*/environ; do
              t=$(cat "$e" 2>/dev/null | tr '\0' '\n' | grep -E '^SETUP_TOKEN=' | head -1 | cut -d= -f2-) || true
              if [ -n "$t" ]; then token="$t"; break; fi
            done
          fi
          if [ -z "$token" ]; then
            token=$(openssl rand -hex 32 2>/dev/null || tr -dc a-f0-9 < /dev/urandom | head -c 64)
            touch .env && chmod 600 .env
            printf 'SETUP_TOKEN=%s\n' "$token" >> .env
            echo "generated new SETUP_TOKEN into $APP_PATH/.env (value not shown)"
            mkdir -p tmp && touch tmp/restart.txt
            echo "touched tmp/restart.txt so the app restarts and loads .env"
          else
            echo "reusing existing SETUP_TOKEN"
          fi
          resp_file=$(mktemp)
          attempt=0
          while :; do
            attempt=$((attempt+1))
            code=$(curl -s -o "$resp_file" -w '%{http_code}' --max-time 25 -X POST \
              -H "Authorization: Bearer $token" \
              "$PUBLIC_URL/api/setup/migrate-verification") || code=000
            if [ "$code" = 200 ]; then break; fi
            echo "POST attempt $attempt -> HTTP $code"
            if [ "$attempt" -ge 8 ]; then
              echo "migration POST failed after $attempt attempts:"
              cat "$resp_file" || true
              exit 1
            fi
            sleep 8
          done
          echo '--- migration response ---'
          cat "$resp_file"; echo
          rm -f "$resp_file"
          EOF
          echo '--- post-migration status check ---'
          status=$(curl -fsS "$PUBLIC_URL/api/setup/migrate-verification")
          echo "$status" | jq .status
          echo "$status" | jq -e '.status.adminColumnsPresent and .status.infoSediInEnum and .status.usersTablePresent and .status.placeVisitsTablePresent' > /dev/null
          echo 'migration_complete'

      # NOC-102: prod admin login returned 500 because ADMIN_PASSWORD and
      # ADMIN_SESSION_SECRET were never provisioned (lsnode spawn env only
      # carries DATABASE_URL). The standalone Next server loads APP_PATH/.env
      # at startup (same channel NOC-101 used for SETUP_TOKEN), so we merge
      # both vars into that file and restart.
      #
      # - ADMIN_SESSION_SECRET is generated on the box and never leaves it.
      # - ADMIN_PASSWORD comes from the optional repo secret ADMIN_PASSWORD
      #   (the secure channel for the board: set it in GitHub → Settings →
      #   Secrets → Actions, then rerun this action). It travels to the box
      #   over SSH stdin — never on a command line, never printed. If the
      #   secret is unset and .env has no password yet, a random placeholder
      #   is written so the login endpoint degrades to a proper
      #   303+error=1 instead of 500; nobody can log in until the real
      #   secret is provisioned.
      # Idempotent: existing .env values are kept unless the repo secret
      # supplies a new password.
      - name: provision-admin-env
        if: inputs.action == 'provision-admin-env'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PUBLIC_URL: ${{ secrets.HOSTINGER_PUBLIC_URL || 'https://www.nocuju.cz' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -eu
          SSH_BASE="ssh -i $HOME/.ssh/id_recover -p $PORT -o BatchMode=yes"

          # 1) Ship the repo-secret password to the box over stdin, if set.
          if [ -n "${ADMIN_PASSWORD:-}" ]; then
            printf '%s' "$ADMIN_PASSWORD" | $SSH_BASE "$USER@$HOST" \
              "umask 077; cat > '$APP_PATH/.admin-password.tmp'"
            echo "password_source=github_secret"
          else
            echo "password_source=none (repo secret ADMIN_PASSWORD not set)"
          fi

          # 2) Merge into APP_PATH/.env, restart, probe wrong-password login.
          $SSH_BASE "$USER@$HOST" \
            "APP_PATH='$APP_PATH' PUBLIC_URL='$PUBLIC_URL' bash -se" <<'EOF'
          set -eu
          cd "$APP_PATH"
          # Durable master copy lives outside APP_PATH — deploys (or
          # Hostinger's app machinery) can wipe APP_PATH/.env (NOC-102), so
          # all values are kept in $HOME/.noc-env and installed into
          # APP_PATH/.env here and on every deploy-ref run.
          MASTER="$HOME/.noc-env"
          [ -f .env ] && echo 'app_env=present' || echo 'app_env=absent'
          touch "$MASTER" && chmod 600 "$MASTER"

          # One-time migration: absorb keys that only exist in APP_PATH/.env
          # (e.g. SETUP_TOKEN from NOC-101) into the master copy.
          if [ -f .env ]; then
            while IFS= read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              key=${line%%=*}
              grep -q "^$key=" "$MASTER" || printf '%s\n' "$line" >> "$MASTER"
            done < .env
          fi

          if ! grep -q '^ADMIN_SESSION_SECRET=' "$MASTER"; then
            secret=$(openssl rand -hex 32 2>/dev/null || tr -dc a-f0-9 < /dev/urandom | head -c 64)
            printf 'ADMIN_SESSION_SECRET=%s\n' "$secret" >> "$MASTER"
            echo 'session_secret=generated (value not shown, stays on the box)'
          else
            echo 'session_secret=already_present'
          fi

          if [ -s .admin-password.tmp ]; then
            pw=$(cat .admin-password.tmp)
            rm -f .admin-password.tmp
            # Write dotenv-safe double-quoted value (escape backslash + quote).
            esc=$(printf '%s' "$pw" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
            grep -v '^ADMIN_PASSWORD=' "$MASTER" > "$MASTER.new" || true
            printf 'ADMIN_PASSWORD="%s"\n' "$esc" >> "$MASTER.new"
            chmod 600 "$MASTER.new" && mv "$MASTER.new" "$MASTER"
            echo 'admin_password=synced_from_github_secret'
          elif grep -q '^ADMIN_PASSWORD=' "$MASTER"; then
            rm -f .admin-password.tmp
            echo 'admin_password=already_present (kept)'
          else
            rm -f .admin-password.tmp
            placeholder=$(openssl rand -hex 24 2>/dev/null || tr -dc a-f0-9 < /dev/urandom | head -c 48)
            printf 'ADMIN_PASSWORD=%s\n' "$placeholder" >> "$MASTER"
            echo 'admin_password=random_placeholder — nobody knows it; set repo secret ADMIN_PASSWORD and rerun this action'
          fi

          cp "$MASTER" .env && chmod 600 .env
          echo "env_installed ($(grep -c '=' .env) keys)"

          mkdir -p tmp && touch tmp/restart.txt
          echo 'restart_signalled'

          attempt=0
          while :; do
            attempt=$((attempt+1))
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 15 \
              --data-urlencode 'password=definitely-not-the-password' \
              "$PUBLIC_URL/api/admin/login") || out='000 '
            code=${out%% *}
            loc=${out#* }
            if [ "$code" = 303 ] && printf '%s' "$loc" | grep -q 'error=1'; then
              echo "wrong_password_probe=ok (HTTP 303 -> $loc)"
              break
            fi
            echo "probe attempt $attempt -> HTTP $code ($loc)"
            if [ "$attempt" -ge 10 ]; then
              echo 'wrong-password probe never turned 303 — app may not have picked up .env; run tail-logs'
              exit 1
            fi
            sleep 8
          done
          EOF

          # 3) If a real password was shipped, verify an actual login from the
          #    runner (secret stays masked in logs; cookie is discarded).
          if [ -n "${ADMIN_PASSWORD:-}" ]; then
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 15 \
              --data-urlencode "password=$ADMIN_PASSWORD" \
              "$PUBLIC_URL/api/admin/login")
            code=${out%% *}
            loc=${out#* }
            if [ "$code" = 303 ] && ! printf '%s' "$loc" | grep -q 'error=1'; then
              echo "real_login_probe=ok (HTTP 303 -> $loc)"
            else
              echo "::error::real login probe failed: HTTP $code -> $loc"
              exit 1
            fi
          fi
          echo 'provision_admin_env_complete'

      # rollback shares the deploy-ref step above (matched by `if:`).
