name: Recover

# Agent-callable Hostinger recovery via SSH.
# Trigger from any laptop with `gh workflow run recover.yml -f action=<action>`.
# Read output with `gh run view <run-id> --log`.
# Design doc: docs/deploy/agent-recovery.md

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do on the Hostinger box"
        required: true
        type: choice
        options:
          - tail-logs
          - verify-deploy
          - pull-and-restart
          - rollback
          - db-bootstrap
          - db-schema-push
          - diagnose
          - hot-patch-server
      lines:
        description: "tail-logs: number of log lines to print (default 200)"
        required: false
        default: "200"
        type: string
      target_sha:
        description: "rollback: commit SHA to check out before restart"
        required: false
        type: string

concurrency:
  group: recover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required secrets
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          set -eu
          missing=()
          [ -z "${HOST:-}" ] && missing+=("HOSTINGER_SSH_HOST")
          [ -z "${USER:-}" ] && missing+=("HOSTINGER_SSH_USER")
          [ -z "${KEY:-}" ] && missing+=("HOSTINGER_SSH_KEY")
          [ -z "${APP_PATH:-}" ] && missing+=("HOSTINGER_APP_PATH")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}"
            echo "Board action required: see docs/deploy/agent-recovery.md §3."
            exit 1
          fi

      - name: Load SSH key
        id: load_ssh
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT_OVERRIDE: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Strip CRs in case the secret was pasted with Windows line endings.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_recover
          chmod 600 ~/.ssh/id_recover
          # Diagnostic: verify private key parses (does not reveal key material).
          if ! ssh-keygen -y -f ~/.ssh/id_recover > /dev/null 2>&1; then
            echo "::error::HOSTINGER_SSH_KEY does not parse as a valid OpenSSH private key."
            echo "Common causes: wrong key pasted (public not private), missing BEGIN/END lines,"
            echo "extra whitespace, or wrong format (PEM vs OpenSSH). Regenerate with"
            echo "ssh-keygen -t ed25519 -f ~/.ssh/noc-recovery and paste the full contents of"
            echo "~/.ssh/noc-recovery (not the .pub file) into HOSTINGER_SSH_KEY."
            exit 1
          fi
          # Diagnostic: ensure HOST is a bare hostname, not user@host or host:port.
          case "$HOST" in
            *@*) echo "::error::HOSTINGER_SSH_HOST contains '@' — it should be just the hostname (paste user part into HOSTINGER_SSH_USER)." ; exit 1 ;;
            *:*) echo "::error::HOSTINGER_SSH_HOST contains ':' — strip any port suffix and set HOSTINGER_SSH_PORT instead." ; exit 1 ;;
            */*) echo "::error::HOSTINGER_SSH_HOST contains '/' — paste just the hostname, not a URL." ; exit 1 ;;
          esac
          # Detect the SSH port. Try, in order:
          #   1. HOSTINGER_SSH_PORT secret if set (explicit override).
          #   2. 65002 — Hostinger Business/Premium shared hosting standard.
          #   3. 22 — generic default (Hostinger VPS, custom setups).
          detected_port=""
          for port in ${PORT_OVERRIDE:-} 65002 22; do
            [ -z "$port" ] && continue
            if ssh-keyscan -T 5 -p "$port" -H "$HOST" >> ~/.ssh/known_hosts 2> /tmp/keyscan.err; then
              detected_port="$port"
              break
            fi
          done
          if [ -z "$detected_port" ]; then
            echo "::error::ssh-keyscan failed on every candidate port (override=${PORT_OVERRIDE:-none}, 65002, 22)."
            echo "stderr from the last attempt (host value is masked by Actions):"
            cat /tmp/keyscan.err
            echo "Likely causes:"
            echo "  - SSH not enabled in hPanel → Advanced → SSH Access yet."
            echo "  - HOSTINGER_SSH_HOST is wrong (use the host shown in hPanel, no user@)."
            echo "  - Non-standard port: set HOSTINGER_SSH_PORT to the value shown in hPanel."
            exit 1
          fi
          echo "Using SSH port: $detected_port"
          echo "port=$detected_port" >> "$GITHUB_OUTPUT"

      - name: tail-logs
        if: inputs.action == 'tail-logs'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          LINES: ${{ inputs.lines }}
        run: |
          set -eu
          LINES_INT="${LINES:-200}"
          # Hostinger writes the Node runtime logs as siblings of server.js in
          # the application root (console.log, stderr.log), not under a nested
          # nodejs/ directory. Tail both, plus the legacy stdout.log path in
          # case the layout differs on other plans.
          #
          # Use a single inline exec command (no heredoc + `env VAR=...` prefix):
          # Hostinger's shared-hosting sshd rejects multi-env-var exec requests
          # with "exec request failed on channel 0". Single-string exec works.
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            "cd \"$APP_PATH\" && for f in stderr.log console.log stdout.log nodejs/stderr.log nodejs/stdout.log; do [ -f \"\$f\" ] || continue; echo \"=== \$f (last $LINES_INT lines) ===\"; tail -n $LINES_INT \"\$f\" || true; echo; done"

      - name: hot-patch-server
        if: inputs.action == 'hot-patch-server'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        # NOC-64 emergency lever. Hostinger's auto-pull on push to main was not
        # firing within 20+ minutes of the fix landing (build artifacts in
        # APP_PATH still mtime to the broken NOC-56 deploy). This action SSHes
        # in and patches the stock Next.js standalone `server.js` in place so
        # the supervisor can spawn a working process. Idempotent: skips if the
        # NOC-64 marker is already present. The patch only changes the port
        # parse + adds a one-line stderr startup diagnostic — the rest of the
        # file is untouched. When Hostinger eventually pulls main, the
        # `postbuild` hook produces an equivalent server.js and this hot patch
        # becomes a no-op.
        run: |
          set -eu
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" "
            set -e
            cd \"$APP_PATH\"
            if grep -q 'NOC-64: patched-port-parse' server.js 2>/dev/null; then
              echo 'server.js already patched (NOC-64 marker present); only restarting'
              touch tmp/restart.txt
              exit 0
            fi

            cp server.js server.js.bak.noc64
            python3 - <<'PY'
import io, os, re, sys
path = 'server.js'
with open(path, 'r', encoding='utf-8') as f:
    src = f.read()

needle = 'const currentPort = parseInt(process.env.PORT, 10) || 3000'
replacement = (
    '// NOC-64: patched-port-parse\n'
    'const __noc64_rawPort = process.env.PORT;\n'
    'const __noc64_parsedPort = parseInt(__noc64_rawPort, 10);\n'
    'const currentPort = Number.isFinite(__noc64_parsedPort)\n'
    '  ? __noc64_parsedPort\n'
    '  : (__noc64_rawPort && __noc64_rawPort.length > 0 ? __noc64_rawPort : 3000);\n'
    'process.stderr.write(\n'
    '  \"[noc startup] \" + JSON.stringify({\n'
    '    rawPort: __noc64_rawPort == null ? null : __noc64_rawPort,\n'
    '    boundTarget: currentPort,\n'
    '    hostname: process.env.HOSTNAME == null ? null : process.env.HOSTNAME,\n'
    '    nodeEnv: process.env.NODE_ENV == null ? null : process.env.NODE_ENV,\n'
    '    passenger: Object.keys(process.env).filter(function (k) {\n'
    '      return /^PASSENGER_/.test(k);\n'
    '    }),\n'
    '  }) + \"\\\\n\",\n'
    ');'
)
if needle not in src:
    print('ERROR: expected port-init needle not found in server.js')
    sys.exit(2)
out = src.replace(needle, replacement)
if out == src:
    print('ERROR: replace produced no change')
    sys.exit(3)
with open(path, 'w', encoding='utf-8') as f:
    f.write(out)
print('OK: server.js patched in place')
PY

            echo '--- patched server.js (head 30) ---'
            head -30 server.js
            echo
            mkdir -p tmp && touch tmp/restart.txt
            echo 'restart_signalled'
          "

      - name: diagnose
        if: inputs.action == 'diagnose'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        run: |
          set -eu
          # Single-command inline exec — Hostinger's sshd rejects heredoc+env requests
          # (see the tail-logs comment above). We bake APP_PATH into the literal string.
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" "
            set +e
            cd \"$APP_PATH\"
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:\$PATH
            echo '=== node --version ==='
            node --version || true
            echo
            echo '=== curl localhost loopback probes ==='
            for p in 3000 8080 \${PORT:-} ; do
              [ -n \"\$p\" ] || continue
              code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \"http://127.0.0.1:\$p/api/health/version\" 2>/dev/null || echo TIMEOUT)
              echo \"port \$p -> \$code\"
            done
            echo
            echo '=== running node processes ==='
            ps -fu \$(id -u) | grep -E '[n]ode|server\\.js' || echo 'no node procs'
            echo
            echo '=== env of running node process (if any) ==='
            for pid in \$(pgrep -u \$(id -u) -f 'server.js' 2>/dev/null); do
              echo --- pid \$pid ---
              ( tr '\\0' '\\n' < /proc/\$pid/environ 2>/dev/null \
                  | grep -Ev '^(.*PASS|.*KEY|.*TOKEN|.*SECRET|DATABASE_URL|.*SSH)' \
                  | sort ) || echo 'cannot read environ'
              echo --- cwd ---
              readlink /proc/\$pid/cwd 2>/dev/null || true
              echo --- cmdline ---
              tr '\\0' ' ' < /proc/\$pid/cmdline 2>/dev/null; echo
            done
            echo
            echo '=== sockets owned by user (ss -tlnp / unix) ==='
            ss -tlnp 2>/dev/null | head -40 || netstat -tlnp 2>/dev/null | head -40 || echo 'no ss/netstat'
            echo
            ss -xlp 2>/dev/null | head -20 || true
            echo
            echo '=== tmp/ contents ==='
            ls -la tmp/ 2>/dev/null || true
            echo
            echo '=== nodejs/.env (existence, NO contents) ==='
            for f in nodejs/.env .env .env.production \$HOME/.env; do
              [ -e \"\$f\" ] && echo \"present: \$f (\$(wc -c < \"\$f\") bytes)\"
            done
            echo
            echo '=== console.log tail (last 60 lines, after diagnose started) ==='
            tail -n 60 console.log 2>/dev/null || true
            echo
            echo '=== which node + path ==='
            command -v node || find /opt /usr /home/\$(whoami) -maxdepth 6 -name node -type f 2>/dev/null | head -5
            echo
            echo '=== server.js head ==='
            head -20 server.js
            echo
            echo '=== timeout 10 node server.js (manual launch, captures stdout+stderr) ==='
            ( timeout --foreground 10 node server.js 2>&1 ) | head -120 || echo manual node exit: \$?
          "

      - name: verify-deploy
        if: inputs.action == 'verify-deploy'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          PROD_BASE_URL: "https://www.nocuju.cz"
        run: |
          set -eu
          # Primary source of truth on Hostinger's managed Node hosting:
          # /api/health/version. The build inlines NEXT_PUBLIC_COMMIT_SHA so
          # the running app reports its own SHA — works even when the box has
          # no .git checkout (Hostinger ships build artifacts, not the repo).
          echo "--- HTTP /api/health/version ---"
          if ! curl -fsS --max-time 10 "$PROD_BASE_URL/api/health/version"; then
            echo
            echo "::warning::HTTP /api/health/version failed — the app may be down."
          fi
          echo
          echo "--- SSH box state ---"
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            env APP_PATH="$APP_PATH" bash -se <<'EOF'
            set -eu
            # Auto-discover the deployed git checkout. Hostinger's "Pull from
            # GitHub" feature drops .git at different paths depending on plan,
            # so we check APP_PATH first, then walk up, then sniff $HOME.
            sha=""
            found_at=""
            for candidate in "$APP_PATH" "$(dirname "$APP_PATH")" "$(dirname "$(dirname "$APP_PATH")")" "$HOME"; do
              [ -d "$candidate/.git" ] || continue
              s=$(git -C "$candidate" rev-parse HEAD 2>/dev/null || true)
              if [ -n "$s" ]; then sha="$s"; found_at="$candidate"; break; fi
            done

            if [ -z "$sha" ]; then
              # No git checkout reachable. Fall back to listing what's there
              # so the agent can decide how to fix the deploy plumbing.
              echo "deploy_mode=no_git_checkout"
              echo "--- ls -la \$APP_PATH ---"
              ls -la "$APP_PATH" 2>/dev/null | head -40 || echo "(APP_PATH not readable)"
              echo "--- candidate .git locations under HOME ---"
              find "$HOME" -maxdepth 4 -name .git -type d 2>/dev/null | head -10 || true
              exit 0
            fi

            echo "deploy_mode=git_checkout"
            echo "deployed_sha=$sha"
            echo "deployed_path=$found_at"
            branch=$(git -C "$found_at" rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)
            echo "deployed_branch=$branch"
            echo "last_commit:"
            git -C "$found_at" log -1 --format='%H %ci %s' || true
          EOF

      - name: pull-and-restart
        if: inputs.action == 'pull-and-restart'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            env APP_PATH="$APP_PATH" bash -se <<'EOF'
            set -eu
            cd "$APP_PATH"
            echo 'before_sha='$(git rev-parse HEAD)
            git fetch --prune origin
            git reset --hard origin/main
            echo 'after_sha='$(git rev-parse HEAD)
            NODE_ENV=production npm ci --prefer-offline --no-audit --no-fund
            npm run build
            mkdir -p tmp
            touch tmp/restart.txt
            echo 'restart_signalled'
          EOF

      - name: db-schema-push
        if: inputs.action == 'db-schema-push'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            env APP_PATH="$APP_PATH" bash -se <<'EOF'
            set -eu
            cd "$APP_PATH"
            # drizzle-kit reads DATABASE_URL from process.env (see drizzle.config.ts).
            # Hostinger's Node.js app sets it as a system env var, so a login
            # shell here inherits it. If it's not exported in the SSH session,
            # surface that clearly instead of silently writing to nothing.
            # Hostinger sets DATABASE_URL on the Node.js process, not in interactive
            # SSH. Try common locations a Hostinger Business plan writes env to.
            for candidate in nodejs/.env .env .env.production "$HOME/.env"; do
              if [ -f "$candidate" ] && grep -q '^DATABASE_URL=' "$candidate"; then
                set -a
                . "$candidate"
                set +a
                break
              fi
            done
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "::error::DATABASE_URL not found in SSH session or .env files"
              echo "Looked in: nodejs/.env, .env, .env.production, ~/.env."
              echo "Fix: paste the prod DSN into a GitHub secret HOSTINGER_DATABASE_URL"
              echo "and rerun this workflow. See docs/deploy/agent-recovery.md §db."
              exit 1
            fi
            echo 'database_host='$(echo "$DATABASE_URL" | sed -E 's|.*@([^/:]+).*|\1|')
            # drizzle-kit lives in devDependencies; prod tree is installed with
            # NODE_ENV=production, so devDeps aren't present. Install on demand.
            npx --yes drizzle-kit push --config=drizzle.config.ts
            echo 'schema_push_complete'
          EOF

      - name: db-bootstrap
        if: inputs.action == 'db-bootstrap'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            env APP_PATH="$APP_PATH" bash -se <<'EOF'
            set -eu
            cd "$APP_PATH"
            for candidate in nodejs/.env .env .env.production "$HOME/.env"; do
              if [ -f "$candidate" ] && grep -q '^DATABASE_URL=' "$candidate"; then
                set -a
                . "$candidate"
                set +a
                break
              fi
            done
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "::error::DATABASE_URL not found in SSH session or .env files"
              echo "Looked in: nodejs/.env, .env, .env.production, ~/.env."
              echo "Fix: paste the prod DSN into a GitHub secret HOSTINGER_DATABASE_URL"
              echo "and rerun this workflow. See docs/deploy/agent-recovery.md §db."
              exit 1
            fi
            echo 'database_host='$(echo "$DATABASE_URL" | sed -E 's|.*@([^/:]+).*|\1|')
            echo '--- step 1: drizzle-kit push'
            npx --yes drizzle-kit push --config=drizzle.config.ts
            echo '--- step 2: seed (idempotent: re-running is safe)'
            npx --yes tsx scripts/seed.ts
            echo 'bootstrap_complete'
          EOF

      - name: rollback
        if: inputs.action == 'rollback'
        env:
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PORT: ${{ steps.load_ssh.outputs.port }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -eu
          if [ -z "${TARGET_SHA:-}" ]; then
            echo "::error::rollback requires -f target_sha=<sha>"
            exit 1
          fi
          ssh -i ~/.ssh/id_recover -p "$PORT" -o BatchMode=yes "$USER@$HOST" bash -se <<EOF
            set -eu
            cd "$APP_PATH"
            echo 'before_sha='\$(git rev-parse HEAD)
            git fetch --prune origin
            git checkout --detach "$TARGET_SHA"
            echo 'after_sha='\$(git rev-parse HEAD)
            NODE_ENV=production npm ci --prefer-offline --no-audit --no-fund
            npm run build
            mkdir -p tmp
            touch tmp/restart.txt
            echo 'restart_signalled'
          EOF
